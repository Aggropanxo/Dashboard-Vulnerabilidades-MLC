<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASHBOARD OPERACIONAL - PLANTA MLC | CPF & CMP</title>
<style>
  /* --- Estilos Base --- */
  body { background-color: #0b1120; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; padding: 30px; margin: 0; }
  
  /* --- Encabezado Corporativo --- */
  .header { border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
  .header-left { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  
  /* Marcas */
  .brand-badges { display: flex; gap: 10px; align-items: center; }
  .brand-badge { background: #1e293b; border: 1px solid #334155; color: #ffffff; font-weight: 800; font-size: 1.3rem; padding: 8px 16px; border-radius: 6px; letter-spacing: 1px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
  .brand-badge.cpf { border-left: 4px solid #38bdf8; }
  .brand-badge.cmp { border-left: 4px solid #ef4444; }

  .header-titles h1 { color: #ffffff; font-size: 2rem; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 1px; }
  .header-titles p { color: #94a3b8; margin: 0; font-size: 1rem; }
  
  /* Botón Administrador */
  .btn-lock { background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; height: fit-content; white-space: nowrap; }
  .btn-lock:hover { background: #1e293b; color: #fff; }
  
  /* --- Panel Admin --- */
  .admin-panel { display: none; background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 30px; flex-wrap: wrap; gap: 10px; border: 1px solid #334155; }
  .admin-panel input { padding: 10px; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; flex-grow: 1; min-width: 150px; }
  .admin-panel button { background: #0284c7; color: white; cursor: pointer; font-weight: bold; border: none; border-radius: 5px; padding: 10px 20px; flex-grow: 0; transition: background 0.3s; }
  .admin-panel button:hover { opacity: 0.9; }
  
  /* --- Grilla de Tags Compactos --- */
  .area-title { color: #38bdf8; font-size: 1.4rem; border-left: 4px solid #38bdf8; padding-left: 12px; margin: 40px 0 20px 0; text-transform: uppercase; letter-spacing: 1px; }
  .critical-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
  
  /* Tarjeta Estilo Tag / Botón de Acceso Rápido */
  .card { 
    background: rgba(15, 23, 42, 0.8); 
    border: 1px solid rgba(239, 68, 68, 0.5); 
    border-radius: 8px; 
    padding: 20px 15px; 
    position: relative; 
    cursor: pointer; 
    transition: all 0.2s ease;
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 80px;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #ef4444;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
  }
  
  .pulse-indicator { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
  
  /* Botones de Acción en el Tag */
  .delete-btn { display: none; position: absolute; bottom: 5px; right: 8px; background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 1rem; z-index: 10; }
  .delete-btn:hover { color: #b91c1c; }
  .edit-btn { display: none; position: absolute; bottom: 5px; left: 8px; background: transparent; border: none; color: #38bdf8; cursor: pointer; font-size: 0.9rem; z-index: 10; }
  .edit-btn:hover { color: #0284c7; }
  
  .asset-tag { color: #fca5a5; font-size: 1.2rem; font-weight: 700; margin: 0; letter-spacing: 0.5px; }
  .asset-sub { color: #94a3b8; font-size: 0.75rem; margin-top: 4px; text-transform: uppercase; }

  /* --- MODO ADMINISTRADOR ACTIVADO --- */
  body.admin-mode .admin-panel { display: flex; }
  body.admin-mode .delete-btn { display: block; }
  body.admin-mode .edit-btn { display: block; }
  body.admin-mode .btn-lock { background: #16a34a; color: white; border-color: #16a34a; }

  /* --- Modal de Resumen y Evidencia Detallada --- */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
  .modal-content { background: #0f172a; padding: 30px; border-radius: 10px; border: 1px solid #38bdf8; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
  .modal-close { position: absolute; top: 15px; right: 20px; color: #fff; font-size: 1.8rem; font-weight: bold; cursor: pointer; background: none; border: none; }
  .modal-close:hover { color: #ef4444; }
  
  .modal-title { color: #fca5a5; font-size: 1.5rem; margin-top: 0; margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
  .modal-data-row { margin-bottom: 15px; }
  .modal-label { color: #38bdf8; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 3px; }
  .modal-value { color: #ffffff; font-size: 1rem; }
  .modal-value.highlight { color: #ef4444; font-weight: bold; }
  
  .modal-image { width: 100%; max-height: 50vh; object-fit: contain; border-radius: 6px; border: 1px solid #334155; margin-top: 10px; background: #000; }
  .no-image-text { color: #94a3b8; margin-top: 10px; font-style: italic; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="brand-badges">
      <span class="brand-badge cpf">CPF</span>
      <span class="brand-badge cmp">CMP</span>
    </div>
    <div class="header-titles">
      <h1>DASHBOARD OPERACIONAL - PLANTA MLC</h1>
      <p>Monitoreo de Condiciones y Diagnóstico de Vulnerabilidades | Nivel: Crítico (Rojo)</p>
    </div>
  </div>
  <button id="btnUnlock" class="btn-lock" onclick="solicitarClave()">🔒 Modo Lectura</button>
</div>

<div class="admin-panel">
  <input type="text" id="inArea" placeholder="Área (ej. Chancado Primario)" required>
  <input type="text" id="inNombre" placeholder="N° Equipo / Tag (ej. M-01)" required>
  <input type="text" id="inVuln" placeholder="Falla (ej. Holgura mecánica)" required>
  <input type="text" id="inEvi" placeholder="Evidencia (ej. Amplitud 15 cpm)" required>
  <input type="text" id="inAccion" placeholder="Acción (ej. Ajuste pernos anclaje)" required>
  <input type="text" id="inImagen" placeholder="URL Imagen (Termografía/Espectro) - Opcional">
  <button id="btnSubmit" onclick="guardarEquipo()">+ Registrar Activo</button>
</div>

<div id="app-root"></div>

<!-- Modal Detallado de Resumen e Imagen -->
<div id="evidenciaModal" class="modal-overlay" onclick="cerrarModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="cerrarModal()">&times;</button>
    <h2 id="modalTitle" class="modal-title">Detalle del Activo</h2>
    
    <div class="modal-data-row">
      <span class="modal-label">Vulnerabilidad Principal</span>
      <span id="modalVuln" class="modal-value"></span>
    </div>
    <div class="modal-data-row">
      <span class="modal-label">Evidencia Moncon</span>
      <span id="modalEvi" class="modal-value highlight"></span>
    </div>
    <div class="modal-data-row">
      <span class="modal-label">Estrategia de Acción Requerida</span>
      <span id="modalAccion" class="modal-value"></span>
    </div>
    <div class="modal-data-row">
      <span class="modal-label">Respaldo Empírico (Espectro / Termografía)</span>
      <div id="modalImageContainer"></div>
    </div>
  </div>
</div>

<!-- Scripts de Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  let isAdmin = false;
  let editId = null; 
  
  function solicitarClave() {
    if (isAdmin) {
      document.body.classList.remove('admin-mode');
      document.getElementById('btnUnlock').innerText = "🔒 Modo Lectura";
      isAdmin = false;
      resetFormulario(); 
      return;
    }
    const claveIngresada = prompt("Ingrese la clave de operaciones para modificar el dashboard:");
    if (claveIngresada === "Moncon2026") {
      document.body.classList.add('admin-mode');
      document.getElementById('btnUnlock').innerText = "🔓 Modo Admin Activo";
      isAdmin = true;
    } else if (claveIngresada !== null) {
      alert("Acceso denegado: Clave incorrecta.");
    }
  }

  // CONFIGURACIÓN FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyBd5MEZdMmgzBs1xCyeGYeKtQx5gJIeY3w",
    authDomain: "dashboard-vulnerabilidades-mlc.firebaseapp.com",
    databaseURL: "https://dashboard-vulnerabilidades-mlc-default-rtdb.firebaseio.com",
    projectId: "dashboard-vulnerabilidades-mlc",
    storageBucket: "dashboard-vulnerabilidades-mlc.firebasestorage.app",
    messagingSenderId: "1043912631590",
    appId: "1:1043912631590:web:14638fc1503882f1268de7"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const equiposRef = database.ref('activos_criticos');
  let equipos = [];

  equiposRef.on('value', (snapshot) => {
    const data = snapshot.val();
    equipos = data ? Object.values(data) : [];
    renderDashboard();
  });

  function guardarEquipo() {
    if (!isAdmin) return; 
    
    const area = document.getElementById('inArea').value.trim();
    const nombre = document.getElementById('inNombre').value.trim();
    const vuln = document.getElementById('inVuln').value.trim();
    const evi = document.getElementById('inEvi').value.trim();
    const accion = document.getElementById('inAccion').value.trim();
    const imagenUrl = document.getElementById('inImagen').value.trim();

    if(area && nombre && vuln) {
      const equipoData = { area, nombre, vulnerabilidad: vuln, evidencia: evi, accion, imagen: imagenUrl };

      if (editId) {
        equipoData.id = editId;
        equiposRef.child(editId).update(equipoData)
          .then(() => { resetFormulario(); })
          .catch(error => alert("❌ Error al actualizar:\n" + error.message));
      } else {
        const nuevoId = Date.now().toString();
        equipoData.id = nuevoId;
        equiposRef.child(nuevoId).set(equipoData)
          .then(() => { resetFormulario(); })
          .catch(error => alert("❌ Error al guardar:\n" + error.message));
      }
    } else {
      alert("⚠️ Error de ingreso: Completa al menos el Área, Tag/Equipo y Falla.");
    }
  }

  function editarEquipo(event, id) {
    event.stopPropagation(); 
    if (!isAdmin) return;
    
    const equipo = equipos.find(eq => eq.id === id);
    if (equipo) {
      document.getElementById('inArea').value = equipo.area;
      document.getElementById('inNombre').value = equipo.nombre;
      document.getElementById('inVuln').value = equipo.vulnerabilidad;
      document.getElementById('inEvi').value = equipo.evidencia;
      document.getElementById('inAccion').value = equipo.accion;
      document.getElementById('inImagen').value = equipo.imagen || '';
      
      editId = id; 
      
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "💾 Guardar Cambios";
      btn.style.background = "#16a34a"; 

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function resetFormulario() {
    document.querySelectorAll('.admin-panel input').forEach(input => input.value = '');
    editId = null;
    const btn = document.getElementById('btnSubmit');
    btn.innerText = "+ Registrar Activo";
    btn.style.background = "#0284c7"; 
  }

  function eliminarEquipo(event, id) {
    event.stopPropagation();
    if (!isAdmin) return; 
    
    const equipo = equipos.find(eq => eq.id === id);
    if (equipo) {
      const confirmacion = confirm(`⚠️ ALERTA DE SISTEMA:\n\n¿Confirma que desea retirar el tag "${equipo.nombre}"?`);
      if (confirmacion) {
        equiposRef.child(id).remove()
          .then(() => { if (editId === id) resetFormulario(); }) 
          .catch(error => console.error("Error al retirar activo: ", error));
      }
    }
  }

  // Mostrar el Resumen Completo y la Imagen en el Modal
  function abrirModal(id) {
    const eq = equipos.find(item => item.id === id);
    if (!eq) return;

    document.getElementById('modalTitle').innerText = `Tag: ${eq.nombre} (${eq.area})`;
    document.getElementById('modalVuln').innerText = eq.vulnerabilidad;
    document.getElementById('modalEvi').innerText = eq.evidencia;
    document.getElementById('modalAccion').innerText = eq.accion;
    
    const imgContainer = document.getElementById('modalImageContainer');
    if (eq.imagen && eq.imagen !== "undefined" && eq.imagen !== "") {
      imgContainer.innerHTML = `<img src="${eq.imagen}" alt="Evidencia ${eq.nombre}" class="modal-image">`;
    } else {
      imgContainer.innerHTML = `<p class="no-image-text">Sin respaldo visual adjunto para este activo.</p>`;
    }

    document.getElementById('evidenciaModal').style.display = 'flex';
  }
  
  function cerrarModal(event) {
    if (event && event.target !== document.getElementById('evidenciaModal')) return;
    document.getElementById('evidenciaModal').style.display = 'none';
  }

  function renderDashboard() {
    const root = document.getElementById('app-root');
    root.innerHTML = '';
    
    const equiposPorArea = equipos.reduce((acc, eq) => {
      (acc[eq.area] = acc[eq.area] || []).push(eq);
      return acc;
    }, {});

    for (const [area, eqs] of Object.entries(equiposPorArea)) {
      const htmlEquipos = eqs.map(eq => `
        <div class="card" onclick="abrirModal('${eq.id}')">
          <div class="pulse-indicator"></div>
          <button class="edit-btn" onclick="editarEquipo(event, '${eq.id}')" title="Editar activo">✏️</button>
          <button class="delete-btn" onclick="eliminarEquipo(event, '${eq.id}')" title="Dar de baja activo">✖</button>
          <h3 class="asset-tag">${eq.nombre}</h3>
          <span class="asset-sub">Ver Detalle</span>
        </div>
      `).join('');
      
      root.innerHTML += `
        <h2 class="area-title">${area}</h2>
        <div class="critical-grid">${htmlEquipos}</div>
      `;
    }
  }
</script>

</body>
</html>
