<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASHBOARD OPERACIONAL - PLANTA MLC | CPF & CMP</title>
<style>
  /* --- Estilos Base --- */
  body { background-color: #0b1120; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; padding: 30px; margin: 0; }
  
  /* --- Encabezado Corporativo --- */
  .header { border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
  .header-left { display: flex; align-items: center; gap: 25px; flex-wrap: wrap; }
  
  /* Contenedor de Logos Alianzas */
  .logos-wrapper { display: flex; gap: 15px; align-items: center; }
  .company-logo { height: 65px; width: 140px; object-fit: contain; background-color: #ffffff; padding: 10px; border-radius: 8px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  
  .header-titles h1 { color: #ffffff; font-size: 2.2rem; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 1px; }
  .header-titles p { color: #94a3b8; margin: 0; font-size: 1.1rem; }
  
  /* Botón Administrador */
  .btn-lock { background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; height: fit-content; white-space: nowrap; }
  .btn-lock:hover { background: #1e293b; color: #fff; }
  
  /* --- Panel Admin --- */
  .admin-panel { display: none; background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 30px; flex-wrap: wrap; gap: 10px; border: 1px solid #334155; }
  .admin-panel input { padding: 10px; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; flex-grow: 1; min-width: 150px; }
  .admin-panel button { background: #0284c7; color: white; cursor: pointer; font-weight: bold; border: none; border-radius: 5px; padding: 10px 20px; flex-grow: 0; transition: background 0.3s; }
  .admin-panel button:hover { opacity: 0.9; }
  
  /* --- Grilla y Tarjetas --- */
  .area-title { color: #38bdf8; font-size: 1.4rem; border-left: 4px solid #38bdf8; padding-left: 12px; margin: 40px 0 20px 0; text-transform: uppercase; letter-spacing: 1px; }
  .critical-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
  .card { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 10px; padding: 25px; position: relative; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 0 15px rgba(239, 68, 68, 0.1); }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(239, 68, 68, 0.25); }
  
  /* Indicador de Pulso */
  .pulse-indicator { position: absolute; top: 25px; right: 80px; width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
  
  /* Botones de Acción (Ocultos por defecto) */
  .delete-btn { display: none; position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 1.3rem; z-index: 10; }
  .delete-btn:hover { color: #b91c1c; }
  .edit-btn { display: none; position: absolute; top: 16px; right: 45px; background: transparent; border: none; color: #38bdf8; cursor: pointer; font-size: 1.2rem; z-index: 10; }
  .edit-btn:hover { color: #0284c7; }
  
  .asset-name { color: #fca5a5; font-size: 1.3rem; margin: 0 0 15px 0; padding-right: 70px; }
  .data-label { color: #94a3b8; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; display: block; margin-top: 12px;}
  .data-value { color: #fff; font-size: 0.95rem; margin-top: 3px; }
  .highlight { color: #ef4444; font-weight: bold; }

  /* --- MODO ADMINISTRADOR ACTIVADO --- */
  body.admin-mode .admin-panel { display: flex; }
  body.admin-mode .delete-btn { display: block; }
  body.admin-mode .edit-btn { display: block; }
  body.admin-mode .btn-lock { background: #16a34a; color: white; border-color: #16a34a; }

  /* --- Modal de Evidencia --- */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
  .modal-content { background: #0f172a; padding: 25px; border-radius: 8px; border: 1px solid #38bdf8; max-width: 90%; max-height: 90%; display: flex; flex-direction: column; align-items: center; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
  .modal-close { position: absolute; top: 10px; right: 15px; color: #fff; font-size: 1.8rem; font-weight: bold; cursor: pointer; background: none; border: none; }
  .modal-close:hover { color: #ef4444; }
  .modal-title { color: #38bdf8; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
  .modal-image { max-width: 100%; max-height: 70vh; border-radius: 4px; border: 1px solid #334155; margin-top: 15px; }
  .no-image-text { color: #94a3b8; margin-top: 20px; font-style: italic; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logos-wrapper">
      <img src="logo.jpeg" alt="Logo CPF Ingeniería" class="company-logo">
      <img src="cmp-logo.png" alt="Logo CMP" class="company-logo">
    </div>
    <div class="header-titles">
      <h1>DASHBOARD OPERACIONAL - PLANTA MLC</h1>
      <p>Monitoreo de Condiciones y Diagnóstico de Vulnerabilidades | Nivel: Crítico (Rojo)</p>
    </div>
  </div>
  <button id="btnUnlock" class="btn-lock" onclick="solicitarClave()">🔒 Modo Lectura</button>
</div>

<div class="admin-panel">
  <input type="text" id="inArea" placeholder="Área (ej. Chancado Primario)" required>
  <input type="text" id="inNombre" placeholder="Equipo (ej. Motor Principal)" required>
  <input type="text" id="inVuln" placeholder="Falla (ej. Holgura mecánica)" required>
  <input type="text" id="inEvi" placeholder="Evidencia (ej. Amplitud 15 cpm)" required>
  <input type="text" id="inAccion" placeholder="Acción (ej. Ajuste pernos anclaje)" required>
  <input type="text" id="inImagen" placeholder="URL Imagen (Termografía/Espectro) - Opcional">
  <!-- Botón ahora con ID para cambiarlo en tiempo de ejecución -->
  <button id="btnSubmit" onclick="guardarEquipo()">+ Registrar Activo</button>
</div>

<div id="app-root"></div>

<div id="evidenciaModal" class="modal-overlay" onclick="cerrarModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="cerrarModal()">&times;</button>
    <h2 id="modalTitle" class="modal-title">Evidencia Técnica</h2>
    <div id="modalImageContainer"></div>
  </div>
</div>

<!-- Scripts de Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  let isAdmin = false;
  let editId = null; // Variable para saber si estamos editando
  
  function solicitarClave() {
    if (isAdmin) {
      document.body.classList.remove('admin-mode');
      document.getElementById('btnUnlock').innerText = "🔒 Modo Lectura";
      isAdmin = false;
      resetFormulario(); // Limpiar si cierra sesión a mitad de edición
      return;
    }
    const claveIngresada = prompt("Ingrese la clave de operaciones para modificar el dashboard:");
    if (claveIngresada === "Moncon2026") {
      document.body.classList.add('admin-mode');
      document.getElementById('btnUnlock').innerText = "🔓 Modo Admin Activo";
      isAdmin = true;
    } else if (claveIngresada !== null) {
      alert("Acceso denegado: Clave incorrecta.");
    }
  }

  // CONFIGURACIÓN FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyBd5MEZdMmgzBs1xCyeGYeKtQx5gJIeY3w",
    authDomain: "dashboard-vulnerabilidades-mlc.firebaseapp.com",
    databaseURL: "https://dashboard-vulnerabilidades-mlc-default-rtdb.firebaseio.com",
    projectId: "dashboard-vulnerabilidades-mlc",
    storageBucket: "dashboard-vulnerabilidades-mlc.firebasestorage.app",
    messagingSenderId: "1043912631590",
    appId: "1:1043912631590:web:14638fc1503882f1268de7"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const equiposRef = database.ref('activos_criticos');
  let equipos = [];

  equiposRef.on('value', (snapshot) => {
    const data = snapshot.val();
    equipos = data ? Object.values(data) : [];
    renderDashboard();
  });

  // FUNCIÓN UNIFICADA (GUARDAR NUEVO O ACTUALIZAR EXISTENTE)
  function guardarEquipo() {
    if (!isAdmin) return; 
    
    const area = document.getElementById('inArea').value.trim();
    const nombre = document.getElementById('inNombre').value.trim();
    const vuln = document.getElementById('inVuln').value.trim();
    const evi = document.getElementById('inEvi').value.trim();
    const accion = document.getElementById('inAccion').value.trim();
    const imagenUrl = document.getElementById('inImagen').value.trim();

    if(area && nombre && vuln) {
      const equipoData = { area, nombre, vulnerabilidad: vuln, evidencia: evi, accion, imagen: imagenUrl };

      if (editId) {
        // Estamos editando un equipo existente
        equipoData.id = editId;
        equiposRef.child(editId).update(equipoData)
          .then(() => {
            resetFormulario();
          })
          .catch(error => alert("❌ Error al actualizar:\n" + error.message));
      } else {
        // Estamos creando un equipo nuevo
        const nuevoId = Date.now().toString();
        equipoData.id = nuevoId;
        equiposRef.child(nuevoId).set(equipoData)
          .then(() => {
            resetFormulario();
          })
          .catch(error => alert("❌ Error al guardar:\n" + error.message));
      }
    } else {
      alert("⚠️ Error de ingreso: Por favor, completa al menos el Área, Equipo y Falla técnica.");
    }
  }

  // FUNCIÓN PARA PREPARAR LA EDICIÓN EN EL FORMULARIO
  function editarEquipo(event, id) {
    event.stopPropagation(); // Evita que se abra la imagen
    if (!isAdmin) return;
    
    const equipo = equipos.find(eq => eq.id === id);
    if (equipo) {
      document.getElementById('inArea').value = equipo.area;
      document.getElementById('inNombre').value = equipo.nombre;
      document.getElementById('inVuln').value = equipo.vulnerabilidad;
      document.getElementById('inEvi').value = equipo.evidencia;
      document.getElementById('inAccion').value = equipo.accion;
      document.getElementById('inImagen').value = equipo.imagen || '';
      
      editId = id; // Guardar el ID que estamos editando
      
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "💾 Guardar Cambios";
      btn.style.background = "#16a34a"; // Color verde para indicar guardado

      // Desplazarse suavemente hacia arriba para ver el formulario
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  // FUNCIÓN PARA LIMPIAR EL FORMULARIO Y SALIR DE EDICIÓN
  function resetFormulario() {
    document.querySelectorAll('.admin-panel input').forEach(input => input.value = '');
    editId = null;
    const btn = document.getElementById('btnSubmit');
    btn.innerText = "+ Registrar Activo";
    btn.style.background = "#0284c7"; // Vuelve al color original
  }

  function eliminarEquipo(event, id) {
    event.stopPropagation();
    if (!isAdmin) return; 
    
    const equipo = equipos.find(eq => eq.id === id);
    if (equipo) {
      const confirmacion = confirm(`⚠️ ALERTA DE SISTEMA (Mantenimiento):\n\n¿Confirma que desea retirar el activo "${equipo.nombre}" del mapa de criticidad operacional?`);
      if (confirmacion) {
        equiposRef.child(id).remove()
          .then(() => { if (editId === id) resetFormulario(); }) // Si estaba editando el que borró, limpia el panel
          .catch(error => console.error("Error al retirar activo: ", error));
      }
    }
  }

  function abrirModal(nombreEquipo, urlImagen) {
    const modal = document.getElementById('evidenciaModal');
    const title = document.getElementById('modalTitle');
    const imgContainer = document.getElementById('modalImageContainer');
    title.innerText = `Evidencia Empírica: ${nombreEquipo}`;
    if (urlImagen && urlImagen !== "undefined" && urlImagen !== "") {
      imgContainer.innerHTML = `<img src="${urlImagen}" alt="Evidencia" class="modal-image">`;
    } else {
      imgContainer.innerHTML = `<p class="no-image-text">Sin respaldo visual adjunto.</p>`;
    }
    modal.style.display = 'flex';
  }
  
  function cerrarModal(event) {
    if (event && event.target !== document.getElementById('evidenciaModal')) return;
    document.getElementById('evidenciaModal').style.display = 'none';
  }

  function renderDashboard() {
    const root = document.getElementById('app-root');
    root.innerHTML = '';
    
    const equiposPorArea = equipos.reduce((acc, eq) => {
      (acc[eq.area] = acc[eq.area] || []).push(eq);
      return acc;
    }, {});

    for (const [area, eqs] of Object.entries(equiposPorArea)) {
      const htmlEquipos = eqs.map(eq => `
        <div class="card" onclick="abrirModal('${eq.nombre}', '${eq.imagen}')">
          <div class="pulse-indicator"></div>
          <button class="edit-btn" onclick="editarEquipo(event, '${eq.id}')" title="Editar activo">✏️</button>
          <button class="delete-btn" onclick="eliminarEquipo(event, '${eq.id}')" title="Dar de baja activo">✖</button>
          <h3 class="asset-name">${eq.nombre}</h3>
          <span class="data-label">Vulnerabilidad Principal</span>
          <span class="data-value">${eq.vulnerabilidad}</span>
          <span class="data-label">Evidencia Moncon</span>
          <span class="data-value highlight">${eq.evidencia}</span>
          <span class="data-label">Estrategia de Acción</span>
          <span class="data-value">${eq.accion}</span>
        </div>
      `).join('');
      
      root.innerHTML += `
        <h2 class="area-title">${area}</h2>
        <div class="critical-grid">${htmlEquipos}</div>
      `;
    }
  }
</script>

</body>
</html>
